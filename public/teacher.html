<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แดชบอร์ดครู NetLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECF1; --panel:#FFFFFF; --ink:#1C2530; --muted:#5A6878; --line:#C6D0DA;
  --orange:#E0701F; --green:#23915A; --blue:#2A66CF; --brown:#8A5A3B;
  --ok:#1A7741; --bad:#C23B3B; --field:#F4F7FA; --warn:#B86A12;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A21; --panel:#1C252E; --ink:#E4EAF0; --muted:#98A7B6; --line:#33414F;
    --orange:#F08A3E; --green:#3DB474; --blue:#5B8EEA; --brown:#B07B57;
    --ok:#45C07A; --bad:#EE6B6B; --field:#141C24; --warn:#E0A050;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A21; --panel:#1C252E; --ink:#E4EAF0; --muted:#98A7B6; --line:#33414F;
  --orange:#F08A3E; --green:#3DB474; --blue:#5B8EEA; --brown:#B07B57;
  --ok:#45C07A; --bad:#EE6B6B; --field:#141C24; --warn:#E0A050;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Anuphan","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.top .brand svg{color:var(--blue)}
.top .who{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 56px)}
.side{border-right:1px solid var(--line);background:var(--panel);padding:16px 12px}
.side h3{font-size:13px;letter-spacing:.04em;color:var(--muted);margin:14px 8px 6px;font-weight:600}
.navbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;font-weight:500}
.navbtn small{color:var(--muted);font-weight:400}
.navbtn.on{background:var(--field);color:var(--blue);font-weight:700}
.navbtn:hover{background:var(--field)}
.main{padding:22px 26px 60px;min-width:0}
h1{font-size:26px;margin:0 0 4px;line-height:1.3}
.sub{color:var(--muted);margin:0 0 18px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:18px;margin:0 0 10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{color:var(--muted);font-size:14px}
.code{font:700 22px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--blue)}
input[type=text],input[type=password],input[type=datetime-local],input[type=search],select,textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:150px;font-family:"JetBrains Mono","Anuphan",monospace;font-size:15px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--field);font-weight:600;position:sticky;top:0}
td.num,th.num{text-align:center;font-family:"JetBrains Mono",monospace}
.matrix th.lab{writing-mode:initial;min-width:74px;font-size:12.5px;line-height:1.3}
.matrix td.cell{text-align:center;font-family:"JetBrains Mono",monospace;cursor:pointer;white-space:nowrap}
.cell.finished{color:var(--ok);font-weight:600}
.cell.timeout{color:var(--warn);font-weight:600}
.cell.running{color:var(--blue)}
.cell.late::after{content:" ช้า";font:600 11px "Anuphan";color:var(--bad)}
.cell.none{color:var(--muted)}
.cell.imported::after{content:" *";font:700 12px "Anuphan";color:var(--blue)}
.reqcard{border-color:var(--bad)}
.sticky1{position:sticky;left:0;background:var(--panel);z-index:1}
.pill{display:inline-block;font-size:12.5px;font-weight:600;border-radius:20px;padding:1px 9px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.warn{color:var(--warn);border-color:var(--warn)}
.msg{font-size:14px;min-height:1.2em;margin-top:6px}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.muted{color:var(--muted)}
.labpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 14px;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--field)}
.labpick label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.labpick h4{grid-column:1/-1;margin:6px 0 2px;font-size:13px;color:var(--muted)}
.creds{font-family:"JetBrains Mono","Anuphan",monospace}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--bad)}
.login{max-width:380px;margin:10vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.login label{display:grid;gap:4px;margin-bottom:10px;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:60;font-weight:600}
.ppchart{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:4px;height:170px;align-items:end;margin-top:8px}
.ppcol{display:grid;grid-template-rows:1fr auto;height:100%;gap:2px;text-align:center}
.ppcol span{font:600 11px "JetBrains Mono",monospace;color:var(--muted)}
.ppbars{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:100%;border-bottom:1px solid var(--line)}
.ppbars i{display:block;width:42%;border-radius:3px 3px 0 0;min-height:2px}
.ppbars i.pre{background:var(--muted)} .ppbars i.post{background:var(--blue)}
.pplegend{display:flex;gap:14px;font-size:14px} .pplegend .k::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pplegend .pre::before{background:var(--muted)} .pplegend .post::before{background:var(--blue)}
.hbars{display:grid;gap:7px}
.hrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px}
.hl small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htrack{height:10px;background:var(--field);border:1px solid var(--line);border-radius:5px;overflow:hidden} .htrack i{display:block;height:100%;background:var(--blue);border-radius:4px} .htrack.none{border-style:dashed}
.hv{font:600 14px "JetBrains Mono",monospace;text-align:right}
.an2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:0 16px}
.cols{display:grid;grid-template-columns:repeat(28,minmax(0,1fr));gap:3px;height:150px;align-items:end}
.col{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;align-items:end}
.col i{display:block;background:var(--blue);border-radius:3px 3px 0 0;min-height:1px;align-self:end}
.col .cv{font:600 10px "JetBrains Mono",monospace;color:var(--muted)} .col .cl{font:400 10px "JetBrains Mono",monospace;color:var(--muted);border-top:1px solid var(--line);padding-top:2px}
.flaglist{margin:0;padding-left:18px} .flaglist li{margin-bottom:6px} .flaglist span{display:block;font-size:14px;color:var(--bad)}
.an td.sticky1,.an th.sticky1{min-width:150px}
.an td.heat{font-family:"JetBrains Mono",monospace;font-size:13px}
.an td.flags{font-size:13px;color:var(--bad);min-width:200px}
th.sortable{cursor:pointer;text-decoration:underline dotted} th.sortable.on{color:var(--blue)}
.menuToggle{display:none}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{display:none;border-right:0;border-bottom:1px solid var(--line)}
  .side.open{display:block}
  .menuToggle{display:inline-block}
  .main{padding:16px}
}
@media print{
  .top,.side,.tabs,.noprint{display:none!important}
  .layout{display:block} .main{padding:0} body{background:#fff;color:#000}
  .card{border:0;padding:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <button class="btn ghost sm menuToggle" id="menuToggle" aria-label="เมนู">เมนู</button>
    <span class="brand"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="8.5" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6.5 10v2h11v-2M12 12v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>แดชบอร์ดครู</span>
  </div>
  <div class="who" id="who"></div>
</header>
<div id="root"></div>
<script>
'use strict';
const root=document.getElementById('root');
let ME=null, LABS=[], CLASSES=[], VIEW={type:'home'}, TAB='scores';
function el(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const k in attrs){ const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='class') e.className=v; else if(k==='style') e.setAttribute('style',v);
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,''); else e.setAttribute(k,v); }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}
async function api(method,path,body){
  let r;
  try{ r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-NetLab':'1'},body:body?JSON.stringify(body):undefined}); }
  catch(e){ throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); }
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const err=new Error(j.message||('HTTP '+r.status)); err.status=r.status; throw err; }
  return j;
}
const toast=t=>{ const x=el('div',{class:'toast',role:'status'},t); document.body.append(x); setTimeout(()=>x.remove(),2600); };
const fmtDT=ms=>ms?new Date(ms).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';
const labById=id=>LABS.find(l=>l.id===id)||{id,label:id,title:''};
const labName=id=>{ const l=labById(id); return `${l.label} ${l.title}`; };
const statusTh={none:'ยังไม่เริ่ม',running:'กำลังทำ',finished:'ส่งแล้ว',timeout:'หมดเวลา'};

/* ---------- boot ---------- */
async function boot(){
  let me;
  try{ me=await api('GET','/api/me'); }catch(e){ root.replaceChildren(el('div',{class:'login'},el('p',{},e.message),el('button',{class:'btn',onclick:boot},'ลองใหม่'))); return; }
  if(!me.db){ root.replaceChildren(el('div',{class:'login'},el('h1',{},'ยังไม่ได้เชื่อมต่อฐานข้อมูล'),el('p',{class:'muted'},'ระบบสมาชิกและแดชบอร์ดครูต้องใช้ PostgreSQL ดูขั้นตอนเพิ่มฐานข้อมูลใน README'),el('a',{href:'/'},'กลับหน้าแล็บ'))); return; }
  if(!me.user||!['teacher','admin'].includes(me.user.role)){ loginView(me.user); return; }
  ME=me.user;
  if(ME.mustChangePw){ pwView(true); return; }
  const c=await api('GET','/api/content'); LABS=c.weeks.concat(c.rooms);
  document.getElementById('who').replaceChildren(
    el('span',{},el('b',{},ME.name),' · ',ME.role==='admin'?'ผู้ดูแลระบบ':'ครู'),
    el('a',{class:'btn ghost sm',href:'/'},'หน้าแล็บนักเรียน'),
    el('button',{class:'btn ghost sm',onclick:()=>pwView(false)},'เปลี่ยนรหัสผ่าน'),
    el('button',{class:'btn ghost sm',onclick:logout},'ออกจากระบบ'));
  await loadClasses();
  render();
}
async function logout(){ await api('POST','/api/auth/logout').catch(()=>{}); location.reload(); }
function loginView(user){
  const u=el('input',{type:'text',autocomplete:'username',autocapitalize:'off'}), p=el('input',{type:'password',autocomplete:'current-password'});
  const msg=el('div',{class:'msg bad'});
  const form=el('form',{class:'login'},el('h1',{},'เข้าสู่ระบบสำหรับครู'),
    user?el('p',{class:'muted'},`บัญชี ${user.name} ไม่มีสิทธิ์ครู ออกจากระบบแล้วเข้าด้วยบัญชีครู`):null,
    el('label',{},'ชื่อผู้ใช้',u),el('label',{},'รหัสผ่าน',p),msg,
    el('div',{class:'row'},el('button',{class:'btn',type:'submit'},'เข้าสู่ระบบ'),user?el('button',{class:'btn ghost',type:'button',onclick:logout},'ออกจากระบบ'):null,el('a',{href:'/'},'กลับหน้าแล็บ')));
  form.addEventListener('submit',async e=>{ e.preventDefault(); msg.textContent='';
    try{ await api('POST','/api/auth/login',{username:u.value,password:p.value}); boot(); }catch(err){ msg.textContent=err.message; } });
  root.replaceChildren(form); u.focus();
}
function pwView(forced){
  const c=el('input',{type:'password',autocomplete:'current-password'}), n=el('input',{type:'password',autocomplete:'new-password'}), n2=el('input',{type:'password',autocomplete:'new-password'});
  const msg=el('div',{class:'msg bad'});
  const form=el('form',{class:'login'},el('h1',{},forced?'ตั้งรหัสผ่านใหม่':'เปลี่ยนรหัสผ่าน'),
    forced?el('p',{class:'muted'},'บัญชีนี้ใช้รหัสผ่านชั่วคราว กรุณาตั้งรหัสผ่านของตัวเองก่อน'):null,
    el('label',{},forced?'รหัสผ่านชั่วคราว':'รหัสผ่านเดิม',c),el('label',{},'รหัสผ่านใหม่ (อย่างน้อย 8 ตัว มีตัวอักษรและตัวเลข)',n),el('label',{},'ยืนยันรหัสผ่านใหม่',n2),msg,
    el('div',{class:'row'},el('button',{class:'btn',type:'submit'},'บันทึก'),forced?null:el('button',{class:'btn ghost',type:'button',onclick:render},'ยกเลิก')));
  form.addEventListener('submit',async e=>{ e.preventDefault(); msg.textContent='';
    if(n.value!==n2.value){ msg.textContent='รหัสผ่านใหม่ไม่ตรงกัน'; return; }
    try{ await api('POST','/api/auth/password',{current:c.value,next:n.value}); toast('เปลี่ยนรหัสผ่านแล้ว'); boot(); }catch(err){ msg.textContent=err.message; } });
  root.replaceChildren(form); c.focus();
}

/* ---------- layout ---------- */
async function loadClasses(){ CLASSES=(await api('GET','/api/teacher/classes')).classes; }
function sidebar(){
  const side=el('nav',{class:'side',id:'side','aria-label':'เมนูแดชบอร์ด'},
    el('button',{class:'navbtn'+(VIEW.type==='home'?' on':''),onclick:()=>go({type:'home'})},'ภาพรวม'),
    el('h3',{},'ห้องเรียน'),
    CLASSES.map(c=>el('button',{class:'navbtn'+(VIEW.type==='class'&&VIEW.id===c.id?' on':''),onclick:()=>go({type:'class',id:c.id})},el('span',{},c.name),c.reset_requests?el('span',{class:'pill bad',title:'คำขอรีเซ็ตรหัสผ่าน'},'ขอรหัส '+c.reset_requests):el('small',{},c.students+' คน'))),
    el('button',{class:'navbtn',onclick:()=>go({type:'new'})},'+ สร้างห้องเรียน'),
    ME.role==='admin'?[el('h3',{},'ผู้ดูแลระบบ'),
      el('button',{class:'navbtn'+(VIEW.type==='teachers'?' on':''),onclick:()=>go({type:'teachers'})},'บัญชีครู'),
      el('button',{class:'navbtn'+(VIEW.type==='backup'?' on':''),onclick:()=>go({type:'backup'})},'สำรองข้อมูล')]:null);
  return side;
}
function go(v){ VIEW=v; if(v.type==='class') TAB=TAB||'scores'; render(); window.scrollTo(0,0); }
document.getElementById('menuToggle').addEventListener('click',()=>{ const s=document.getElementById('side'); if(s) s.classList.toggle('open'); });
async function render(){
  const main=el('main',{class:'main'},el('p',{class:'muted'},'กำลังโหลด...'));
  root.replaceChildren(el('div',{class:'layout'},sidebar(),main));
  try{
    if(VIEW.type==='home') await homeView(main);
    else if(VIEW.type==='new') newClassView(main);
    else if(VIEW.type==='class') await classView(main);
    else if(VIEW.type==='teachers') await teachersView(main);
    else if(VIEW.type==='backup') backupView(main);
  }catch(e){ main.replaceChildren(el('div',{class:'card'},el('p',{class:'msg bad'},e.message),el('button',{class:'btn',onclick:render},'ลองใหม่'))); }
}

/* ---------- views ---------- */
async function homeView(main){
  const total=CLASSES.reduce((a,c)=>a+c.students,0);
  main.replaceChildren(
    el('h1',{},'สวัสดี '+ME.name),
    el('p',{class:'sub'},'จัดการห้องเรียน มอบหมายแล็บ และดูคะแนนที่นักเรียนส่งเข้ามาในระบบ'),
    el('div',{class:'stats'},
      el('div',{class:'stat'},el('b',{},CLASSES.length),el('span',{},'ห้องเรียน')),
      el('div',{class:'stat'},el('b',{},total),el('span',{},'นักเรียนทั้งหมด')),
      el('div',{class:'stat'},el('b',{},CLASSES.reduce((a,c)=>a+c.assignments,0)),el('span',{},'งานที่มอบหมาย'))),
    CLASSES.length?el('div',{class:'tablewrap'},el('table',{},
      el('tr',{},el('th',{},'ห้องเรียน'),el('th',{},'รหัสห้อง'),el('th',{class:'num'},'นักเรียน'),el('th',{class:'num'},'งาน'),ME.role==='admin'?el('th',{},'ครู'):null,el('th',{},'')),
      CLASSES.map(c=>el('tr',{},el('td',{},c.name),el('td',{class:'creds'},c.code),el('td',{class:'num'},c.students),el('td',{class:'num'},c.assignments),ME.role==='admin'?el('td',{},c.teacher):null,
        el('td',{},el('button',{class:'btn sm',onclick:()=>go({type:'class',id:c.id})},'เปิด'))))))
      :el('div',{class:'card empty'},el('p',{},'ยังไม่มีห้องเรียน'),el('button',{class:'btn',onclick:()=>go({type:'new'})},'สร้างห้องเรียนแรก')));
}
function newClassView(main){
  const name=el('input',{type:'text',placeholder:'เช่น ปวช.2/1 เครือข่ายคอมพิวเตอร์',style:'flex:1;min-width:220px'});
  const msg=el('div',{class:'msg bad'});
  const form=el('form',{class:'card'},el('h2',{},'สร้างห้องเรียน'),el('p',{class:'muted'},'ระบบจะสร้างรหัสห้อง 6 ตัวให้ นักเรียนใช้รหัสนี้สมัครเอง หรือครูสร้างบัญชีให้ทั้งห้องก็ได้'),

/* ---------- simulator results ---------- */
async function simsTab(body,c){
  const d=await api('GET',`/api/teacher/classes/${c.id}/sims`);
  let sim=d.sims[0].id;
  const wrap=el('div');
  const draw=()=>{ const s=d.sims.find(x=>x.id===sim);
    const full=st=>s.missions.filter(m=>{ const r=st.results[s.id+':'+m.id]; return r&&r.best>=r.max; }).length;
    const total=d.students.reduce((a,st)=>a+full(st),0);
    wrap.replaceChildren(
      el('div',{class:'row noprint',style:'margin-bottom:10px'},d.sims.map(x=>el('button',{class:'btn sm'+(x.id===sim?'':' ghost'),onclick:()=>{ sim=x.id; draw(); }},x.title)),el('button',{class:'btn ghost sm',onclick:render},'รีเฟรช'),el('button',{class:'btn ghost sm',onclick:()=>window.print()},'พิมพ์')),
      el('div',{class:'stats'},el('div',{class:'stat'},el('b',{},s.missions.length),el('span',{},'ภารกิจ')),
        el('div',{class:'stat'},el('b',{},d.students.filter(st=>full(st)===s.missions.length).length+' / '+d.students.length),el('span',{},'ผ่านครบทุกภารกิจ')),
        el('div',{class:'stat'},el('b',{},d.students.length?Math.round(total/(d.students.length*s.missions.length)*100)+'%':'-'),el('span',{},'ภารกิจที่ผ่านรวมทั้งห้อง'))),
      !d.students.length?el('div',{class:'card empty'},'ยังไม่มีนักเรียนในห้องนี้'):
      el('div',{class:'tablewrap'},el('table',{class:'matrix'},
        el('tr',{},el('th',{class:'num'},'เลขที่'),el('th',{class:'sticky1'},'ชื่อ–สกุล'),s.missions.map((m,i)=>el('th',{class:'lab num',title:m.title},`ภารกิจ ${i+1}`,el('br'),el('span',{class:'muted'},`(${m.max})`))),el('th',{class:'num'},'ผ่าน')),
        d.students.map(st=>el('tr',{},el('td',{class:'num'},st.no),el('td',{class:'sticky1'},st.name),
          s.missions.map(m=>{ const r=st.results[s.id+':'+m.id]; return el('td',{class:'cell '+(!r?'none':r.best>=r.max?'finished':'running'),style:'cursor:default',title:r?`${m.title}: ดีที่สุด ${r.best}/${r.max} · ส่ง ${r.attempts} ครั้ง`:m.title+': ยังไม่ทำ'},r?r.best:'–'); }),
          el('td',{class:'num'},full(st)+'/'+s.missions.length))))),
      el('p',{class:'muted',style:'font-size:14px'},'ตัวเลขคือคะแนนดีที่สุดของแต่ละภารกิจ (ระบบตรวจที่เซิร์ฟเวอร์) สีเขียว = ได้เต็ม วางเมาส์บนช่องเพื่อดูจำนวนครั้งที่ส่ง'),
      el('h4',{},'รายชื่อภารกิจ'),el('ol',{style:'font-size:14px'},s.missions.map(m=>el('li',{},m.title,' ',el('small',{class:'muted'},LEVEL_TH[m.level]||m.level||'')))));
  };
  draw(); body.replaceChildren(wrap);
}

function settingsTab(body,c,det){
  const name=el('input',{type:'text',value:c.name,style:'flex:1;min-width:220px'});
  const open=el('input',{type:'checkbox',checked:c.joinOpen});
  const msg=el('div',{class:'msg'});
  const form=el('form',{class:'card'},el('h2',{},'ตั้งค่าห้องเรียน'),
    el('div',{class:'row'},el('label',{class:'row',style:'flex:1'},'ชื่อห้อง',name)),
    el('label',{class:'row',style:'margin-top:10px'},open,'เปิดให้นักเรียนสมัครเองด้วยรหัสห้อง ',el('span',{class:'code',style:'font-size:16px'},c.code)),

  form.addEventListener('submit',async e=>{ e.preventDefault();

    catch(err){ msg.className='msg bad'; msg.textContent=err.message; } });
  const del=el('div',{class:'card'},el('h2',{},'ลบห้องเรียน'),el('p',{class:'muted'},'ลบได้เมื่อไม่มีนักเรียนในห้องแล้วเท่านั้น'),

function lbCard(c){
  const cb=el('input',{type:'checkbox',checked:!!c.leaderboard,onchange:async e=>{ try{ await api('PATCH',`/api/teacher/classes/${c.id}/leaderboard`,{enabled:e.target.checked}); c.leaderboard=e.target.checked; toast(e.target.checked?'เปิดกระดานคะแนนแล้ว':'ปิดกระดานคะแนนแล้ว'); }catch(err){ alert(err.message); e.target.checked=!e.target.checked; } }});
  return el('div',{class:'card'},el('h2',{},'กระดานคะแนน (Leaderboard)'),
    el('label',{class:'row'},cb,'เปิดกระดานคะแนน XP ให้นักเรียนในห้องนี้เห็น'),
    el('p',{class:'muted',style:'font-size:14px;margin:6px 0 0'},'ค่าเริ่มต้นปิดไว้ เมื่อเปิด นักเรียนเห็นอันดับ 10 คนแรกและอันดับของตัวเอง ชื่อเพื่อนจะแสดงเฉพาะคนที่เลือกเปิดเผยชื่อเอง คนอื่นแสดงเป็น "ไม่เปิดเผยชื่อ" กระดานแสดงเฉพาะ XP ไม่แสดงคะแนนสอบหรือคะแนนแล็บ'));
}
