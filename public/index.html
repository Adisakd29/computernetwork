<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetLab ห้องปฏิบัติการเครือข่ายคอมพิวเตอร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECF1; --panel:#FFFFFF; --ink:#1C2530; --muted:#5A6878; --line:#C6D0DA;
  --orange:#E0701F; --green:#23915A; --blue:#2A66CF; --brown:#8A5A3B; --wo:#F3F3F0;
  --ok:#1F8A4C; --bad:#C23B3B; --term-bg:#0F1A24; --term-ink:#CFE3D6; --term-dim:#7C93A6;
  --field:#F4F7FA;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A21; --panel:#1C252E; --ink:#E4EAF0; --muted:#98A7B6; --line:#33414F;
    --orange:#F08A3E; --green:#3DB474; --blue:#5B8EEA; --brown:#B07B57; --wo:#E8E8E4;
    --ok:#45C07A; --bad:#EE6B6B; --term-bg:#0A1118; --field:#141C24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A21; --panel:#1C252E; --ink:#E4EAF0; --muted:#98A7B6; --line:#33414F;
  --orange:#F08A3E; --green:#3DB474; --blue:#5B8EEA; --brown:#B07B57; --wo:#E8E8E4;
  --ok:#45C07A; --bad:#EE6B6B; --term-bg:#0A1118; --field:#141C24;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Anuphan","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:17px;line-height:1.65}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 64px}

/* hero: the 8 wires of a T568B plug */
.wires{display:flex;gap:5px;height:88px;align-items:flex-end;margin:8px 0 18px}
.wire{flex:1;border-radius:6px 6px 2px 2px;position:relative}
.wire span{position:absolute;bottom:6px;left:0;right:0;text-align:center;font:600 12px "JetBrains Mono",monospace;color:#fff;mix-blend-mode:normal}
.wire.w span{color:#333}
@media (prefers-reduced-motion:no-preference){
  .wire{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{transform:scaleY(.1);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
}
h1{font-size:34px;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 22px;max-width:60ch}

.namebox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:22px}
.namebox label{font-weight:600}
.namebox input{flex:1;min-width:180px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 12px}

.progress{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}
.progress strong{font-size:22px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:26px}
.bar i{display:block;height:100%;background:var(--green);transition:width .4s}

.rooms{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.room{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;width:100%;padding:0}
.room .strip{width:14px;flex:none}
.room .body{padding:14px 16px;flex:1}
.room .num{font:600 13px "JetBrains Mono",monospace;color:var(--muted)}
.room h2{font-size:19px;margin:2px 0 4px;line-height:1.35}
.room p{margin:0;color:var(--muted);font-size:15px}
.room .stat{padding:14px 16px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;min-width:84px;font-size:14px;color:var(--muted)}
.room .stat b{font-size:20px;color:var(--ink)}
.room.done .stat b{color:var(--ok)}

.foot{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}

/* room view */
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;margin-bottom:6px}
.roomhead{display:flex;gap:16px;margin-bottom:18px}.roomhead .rs{width:10px;flex:none;border-radius:3px}
.roomhead h1{font-size:28px}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:20px}
.intro p{margin:.3em 0}
.task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.task.solved{border-color:var(--ok)}
.task .tq{display:flex;gap:12px}
.task .tn{font:600 14px "JetBrains Mono",monospace;color:var(--muted);padding-top:2px;flex:none}
.task .qtext{flex:1}
.task .qtext p{margin:0 0 10px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1;min-width:160px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:"JetBrains Mono","Anuphan",monospace;font-size:15px}
.row input:disabled{opacity:.8}
.msg{font-size:15px;margin-top:8px;min-height:1em}
.msg.ok{color:var(--ok);font-weight:600}
.msg.bad{color:var(--bad)}
.hint{background:none;border:0;color:var(--blue);padding:4px 0;font-size:15px;margin-top:4px}
.hinttext{font-size:15px;color:var(--muted);border-left:3px solid var(--blue);padding-left:10px;margin-top:6px}
.explain{font-size:15px;background:var(--field);border-radius:8px;padding:8px 12px;margin-top:10px}
pre.out{background:var(--term-bg);color:var(--term-ink);font:13.5px/1.5 "JetBrains Mono",monospace;border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 12px;white-space:pre}
.choices{display:grid;gap:8px}
.choice{display:block;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.choice.picked-bad{border-color:var(--bad);color:var(--bad)}
.choice.picked-ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel));font-weight:600}

/* ordering */
.slots{display:grid;gap:6px;margin-bottom:10px}
.slot{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:8px;padding:7px 10px;min-height:42px;background:var(--field);text-align:left;width:100%}
.slot .pin{font:600 13px "JetBrains Mono",monospace;color:var(--muted);width:48px;flex:none}
.slot.filled{border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:15px}
.sw{width:26px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}

/* terminal */
.term{background:var(--term-bg);color:var(--term-ink);border-radius:12px;font:14px/1.55 "JetBrains Mono",monospace;margin-bottom:20px;overflow:hidden}
.term .tbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:rgba(255,255,255,.06);color:var(--term-dim);font-size:13px}
.term .screen{height:340px;overflow:auto;padding:12px 14px;white-space:pre;}
.term .line{white-space:pre}
.term .prompt{color:#8FD3A8}
.term .inrow{display:flex;gap:8px;padding:0 14px 12px;align-items:center}
.term .inrow input{flex:1;background:transparent;border:0;color:var(--term-ink);font:inherit;outline:none;min-width:0}
.term .quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.term .quick button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--term-ink);border-radius:6px;padding:3px 9px;font:12.5px "JetBrains Mono",monospace}

.tag{display:inline-block;font-size:12.5px;font-weight:600;color:var(--brown);border:1px solid var(--brown);border-radius:4px;padding:0 6px;margin:0 0 6px 8px;vertical-align:middle}
.qtext>.tag{margin-left:0}
.ref{font-size:14px;color:var(--muted)}
.tag.vm{color:var(--blue);border-color:var(--blue)}
.vmhead{font-size:22px;margin:30px 0 4px}
.vmnote{color:var(--muted);margin:0 0 12px;font-size:15px}
.vm{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.vmstatus{font-size:15px;color:var(--muted);margin-bottom:10px}
.vmstatus.bad{color:var(--bad)}
.vmscreen{background:#000;color:#ddd;border-radius:8px;overflow:auto;min-height:320px;padding:6px;cursor:text}
.vmscreen canvas{max-width:100%}
.startcard{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center}
.startcard .big{font-size:24px;font-weight:700;margin:0 0 6px}
.startcard p{margin:0 0 14px;color:var(--muted)}
.btn.start{font-size:19px;padding:12px 28px;background:var(--green);color:#fff}
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.timer .clock{font:700 26px "JetBrains Mono",monospace;flex:1}
.timer.warn{border-color:var(--orange)} .timer.warn .clock{color:var(--orange)}
.timer.urgent{border-color:var(--bad)} .timer.urgent .clock{color:var(--bad)}
.timer.done{justify-content:space-between;color:var(--muted)} .timer.done b{color:var(--ink)}
.tstat{font-size:13px;margin-top:2px}
.flag{background:var(--panel);border:2px solid var(--ok);border-radius:12px;padding:16px 18px;margin-top:20px}
.flag code{font:600 16px "JetBrains Mono",monospace;color:var(--ok)}

/* summary */
.cert{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.cert h1{font-size:26px}
.cert table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
.cert td{padding:8px 0;border-bottom:1px solid var(--line)}
.cert td:last-child{text-align:right;font-family:"JetBrains Mono",monospace}
.code{font:600 20px "JetBrains Mono",monospace;letter-spacing:.08em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- data ---------- */
const WIRE = {
  wo:'repeating-linear-gradient(135deg,var(--wo) 0 6px,var(--orange) 6px 10px)',
  o:'var(--orange)',
  wg:'repeating-linear-gradient(135deg,var(--wo) 0 6px,var(--green) 6px 10px)',
  bl:'var(--blue)',
  wb:'repeating-linear-gradient(135deg,var(--wo) 0 6px,var(--blue) 6px 10px)',
  g:'var(--green)',
  wbr:'repeating-linear-gradient(135deg,var(--wo) 0 6px,var(--brown) 6px 10px)',
  br:'var(--brown)'
};
const PIN=[WIRE.wo,WIRE.o,WIRE.wg,WIRE.bl,WIRE.wb,WIRE.g,WIRE.wbr,WIRE.br];
const C=(q,options,correct,hint,explain,extra)=>Object.assign({type:'choice',q,options,correct,hint,explain},extra||{});
const T=(q,answers,hint,explain,extra)=>Object.assign({type:'text',q,answers,hint,explain},extra||{});

const ROOMS = [
{
  id:'r1', title:'พื้นฐานเครือข่ายและ Topology', ref:'เล่ม 1 บท 1 และเล่ม 2 บท 1, 3',
  blurb:'ส่วนประกอบการสื่อสาร ประเภทเครือข่าย LAN/MAN/WAN และรูปแบบการเชื่อมต่อ',
  intro:['การสื่อสารข้อมูลมีส่วนประกอบหลัก 5 อย่าง คือ ผู้ส่ง ผู้รับ ข้อความ สื่อกลาง และโปรโตคอล','เครือข่ายแบ่งตามขนาดพื้นที่เป็น LAN, MAN, WAN และแบ่งตามรูปแบบการต่อ (Topology) เป็น Bus, Star, Ring, Mesh'],
  flag:'NET{hello_network}',
  tasks:[
    C('ข้อใดไม่ใช่ส่วนประกอบของระบบการสื่อสารข้อมูล',['ผู้ส่งและผู้รับ','ข้อความ','สื่อกลาง','โปรโตคอล','ไฟร์วอลล์'],4,'ส่วนประกอบหลักมี 5 อย่าง ลองนับดู','ไฟร์วอลล์เป็นอุปกรณ์ด้านความปลอดภัย ไม่ใช่ส่วนประกอบพื้นฐานของการสื่อสาร'),
    C('เครือข่ายที่เชื่อมคอมพิวเตอร์ภายในอาคารของวิทยาลัยเรียกว่าอะไร',['LAN','MAN','WAN','PAN'],0,'Local = ท้องถิ่น พื้นที่จำกัด','LAN (Local Area Network) ครอบคลุมพื้นที่ใกล้ ๆ เช่น อาคาร หรือบริเวณวิทยาลัย'),
    C('ธนาคารเชื่อมเครือข่ายสาขาทั่วประเทศ เป็นเครือข่ายประเภทใด',['LAN','MAN','WAN','PAN'],2,'Wide = กว้าง','WAN (Wide Area Network) ครอบคลุมพื้นที่กว้างระดับประเทศหรือโลก'),
    C('ทุกเครื่องต่อสายเข้าหา Switch ตัวกลาง เป็น Topology แบบใด',['Bus','Star','Ring','Mesh'],1,'รูปร่างเหมือนดาวที่มีจุดศูนย์กลาง','Star เป็นแบบที่ใช้มากที่สุดในปัจจุบัน สายเส้นหนึ่งเสีย เครื่องอื่นยังใช้ได้'),
    C('ทุกเครื่องต่อกับสายหลักเส้นเดียว ถ้าสายหลักขาด ทั้งระบบใช้ไม่ได้ คือ Topology แบบใด',['Bus','Star','Ring','Mesh'],0,'เหมือนรถเมล์ที่วิ่งเส้นทางเดียว','Bus ใช้สายน้อย แต่สายหลักเป็นจุดอ่อน'),
    C('เครื่องต่อกันเป็นวง ส่งข้อมูลต่อกันไปทีละเครื่องทางเดียว คือ Topology แบบใด',['Bus','Star','Ring','Mesh'],2,'วงแหวน','Ring ข้อมูลวิ่งวนเป็นวงผ่านทุกเครื่อง'),
    C('เครือข่ายที่ทุกเครื่องมีสถานะเท่ากัน แชร์ไฟล์ให้กันได้โดยไม่มีเซิร์ฟเวอร์กลาง เรียกว่าอะไร',['Client/Server','Peer-to-Peer','Mainframe','Cloud'],1,'Peer = เพื่อนที่เท่าเทียมกัน','Peer-to-Peer เหมาะกับเครือข่ายเล็ก ส่วน Client/Server มีเครื่องแม่ข่ายให้บริการ'),
    T('Mesh Topology ที่มี 5 เครื่อง ต่อถึงกันทุกคู่ ต้องใช้สายกี่เส้น',['10'],'สูตร n(n−1)/2','5 × 4 ÷ 2 = 10 เส้น',{c:true}),
    C('ข้อใดไม่ใช่เกณฑ์วัดประสิทธิภาพของเครือข่าย',['ประสิทธิภาพ (Performance)','ความน่าเชื่อถือ (Reliability)','ความปลอดภัย (Security)','สีของสายสัญญาณ'],3,'เกณฑ์มี 3 ด้าน','เกณฑ์วัดเครือข่ายคือ Performance, Reliability และ Security',{c:true})
  ]
},
{
  id:'r2', title:'อุปกรณ์และสื่อนำสัญญาณ', ref:'เล่ม 1 บท 2 และเล่ม 2 บท 3, 6',
  blurb:'Hub, Switch, Router, สายสัญญาณ, สื่อไร้สาย และการมัลติเพล็กซ์',
  intro:['อุปกรณ์เครือข่ายแต่ละชนิดทำงานต่างกัน สื่อกลางมีทั้งแบบใช้สาย (Guided) และไร้สาย (Wireless)','ภารกิจท้าทายในห้องนี้เป็นเรื่องการมัลติเพล็กซ์ คือการส่งข้อมูลหลายช่องผ่านสื่อเส้นเดียว'],
  flag:'NET{gear_up}',
  tasks:[
    C('อุปกรณ์ใดเชื่อมเครือข่ายต่างวงเข้าด้วยกันและเลือกเส้นทางส่งข้อมูล',['Hub','Switch','Router','Repeater'],2,'ทำงานกับ IP Address','Router เลือกเส้นทาง (Routing) ระหว่างเครือข่าย'),
    C('Hub ส่งต่อข้อมูลที่ได้รับอย่างไร',['ส่งเฉพาะพอร์ตปลายทาง','กระจายไปทุกพอร์ต','ส่งกลับผู้ส่ง','เก็บไว้ไม่ส่งต่อ'],1,'Hub ไม่รู้จัก MAC Address','Hub กระจายข้อมูลทุกพอร์ต ทำให้ชนกันง่ายและช้ากว่า Switch'),
    C('อุปกรณ์ใดทำหน้าที่ขยายสัญญาณให้ส่งได้ไกลขึ้น',['Repeater','Router','Firewall','Modem'],0,'Repeat = ทำซ้ำ','Repeater รับสัญญาณที่อ่อนลงแล้วส่งต่อใหม่ให้แรงขึ้น'),
    C('UTP ย่อมาจากอะไร',['Unshielded Twisted Pair','Universal Transfer Port','Unified Twisted Plug','Ultra Twisted Pair'],0,'สายตีเกลียวที่ไม่มีชีลด์','UTP คือสายคู่ตีเกลียวไม่มีฉนวนหุ้มชีลด์ ราคาถูก ใช้มากที่สุด'),
    C('สื่อกลางใดส่งข้อมูลด้วยแสง เร็วมาก และไม่ถูกรบกวนจากคลื่นแม่เหล็กไฟฟ้า',['UTP','Coaxial','Fiber Optic','STP'],2,'ใยแก้ว','Fiber Optic ส่งด้วยแสงผ่านใยแก้ว ส่งได้ไกลและเร็ว'),
    C('หัวต่อแบบใดใช้กับสาย Coaxial',['RJ-45','BNC','RJ-11','USB'],1,'หัวกลมมีตัวล็อกแบบบิด','BNC ใช้กับสาย Coaxial รุ่นเก่า'),

function el(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==='class')e.className=attrs[k];
    else if(k==='style')e.setAttribute('style',attrs[k]);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});
  return e;
}

let TICK=null;
const fmt=ms=>{ms=Math.max(0,ms);const t=Math.round(ms/1000);const m=Math.floor(t/60),sec=t%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');};
const timerOf=r=>S.timers[r.id];
function stopTick(){ if(TICK){clearInterval(TICK);TICK=null;} }
function startLab(ri){
  const r=ROOMS[ri];
  S.timers[r.id]={start:Date.now(),limit:r.minutes*60000,status:'running'};
  save(); openRoom(ri);
}
function finishLab(ri,status){
  const r=ROOMS[ri], t=timerOf(r); if(!t||t.status!=='running')return;
  t.status=status; t.end=status==='timeout'?t.start+t.limit:Date.now(); save();
  stopVM(); openRoom(ri);
}
function allDone(r){ return roomDone(r)===r.tasks.length && vmDone(r)===(r.vmTasks||[]).length; }
function timerBar(r,ri){
  const t=timerOf(r);
  if(t.status!=='running'){
    const used=fmt(t.end-t.start);
    return el('div',{class:'timer done'},
      el('span',{},t.status==='timeout'?'หมดเวลาแล้ว':'ส่งงานแล้ว'),
      el('b',{},'ใช้เวลา '+used+' จาก '+r.minutes+' นาที'));
  }
  const left=el('b',{class:'clock'},fmt(t.start+t.limit-Date.now()));
  const bar=el('div',{class:'timer'},
    el('span',{},'เวลาที่เหลือ'),left,
    el('button',{class:'btn ghost',onclick:()=>{ if(confirm('ส่งงานและหยุดจับเวลา? หลังส่งแล้วจะแก้คำตอบไม่ได้')) finishLab(ri,'finished'); }},'ส่งงาน'));
  stopTick();
  const upd=()=>{
    const ms=t.start+t.limit-Date.now();
    left.textContent=fmt(ms);
    bar.classList.toggle('warn',ms<=5*60000); bar.classList.toggle('urgent',ms<=60000);
    if(ms<=0){ stopTick(); finishLab(ri,'timeout'); }
  };
  upd(); TICK=setInterval(upd,1000);
  return bar;
}
function startCard(r,ri){

function taskCard(r,ri,t,i,idOverride){
  const id=idOverride||tid(r,i), solved=!!S.done[id];
  const card=el('div',{class:'task'+(solved?' solved':'')});
  const msg=el('div',{class:'msg'+(solved?' ok':'')},solved?'ถูกต้อง':'');
  const q=el('div',{class:'qtext'},t.c?el('span',{class:'tag'},'ท้าทาย'):null,el('p',{},t.q));
  if(t.pre) q.append(el('pre',{class:'out'},t.pre));

  const markSolved=()=>{
    S.done[id]=true; save();
    card.classList.add('solved'); msg.className='msg ok'; msg.textContent='ถูกต้อง';
    if(t.explain && !card.querySelector('.explain')) q.append(el('div',{class:'explain'},t.explain));
    renderFlag(r,ri);
    if(allDone(r)) setTimeout(()=>finishLab(ri,'finished'),1200);
  };
  const wrong=txt=>{msg.className='msg bad';msg.textContent=txt||'ยังไม่ถูก ลองใหม่อีกครั้ง';};

  if(t.type==='text'){
    const inp=el('input',{placeholder:'พิมพ์คำตอบ',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'คำตอบ'});
    if(solved){inp.value=t.answers[0];inp.disabled=true;}
    const check=()=>{
      if(S.done[id])return;
      const nf=t.exact?(s=>String(s).toLowerCase().replace(/\s+/g,'')):norm; const v=nf(inp.value); if(!v){wrong('พิมพ์คำตอบก่อนกดตรวจ');return;}
      if(t.answers.some(a=>t.contains?v.includes(nf(a)):nf(a)===v)){inp.disabled=true;btn.disabled=true;markSolved();}
      else wrong();
    };
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
    const btn=el('button',{class:'btn',onclick:check},'ตรวจคำตอบ'); if(solved)btn.disabled=true;
    q.append(el('div',{class:'row'},inp,btn));
  }
  if(t.type==='choice'){
    const box=el('div',{class:'choices'});
    t.options.forEach((o,oi)=>{
      const b=el('button',{class:'choice'+(solved&&oi===t.correct?' picked-ok':'')},o);
      b.addEventListener('click',()=>{
        if(S.done[id])return;
        if(oi===t.correct){b.className='choice picked-ok';markSolved();}
        else{b.className='choice picked-bad';wrong();}
      });
      box.append(b);
    });
    q.append(box);
  }
  if(t.type==='order'){
    q.append(orderWidget(id,t,solved,markSolved,wrong));
  }
  q.append(msg);
  if(solved && t.explain) q.append(el('div',{class:'explain'},t.explain));
  // hint
  if(t.hint){
    const hb=el('div');
    const showHint=()=>{hb.innerHTML='';hb.append(el('div',{class:'hinttext'},t.hint));};
    if(S.hints[id]) showHint();
    else hb.append(el('button',{class:'hint',onclick:()=>{S.hints[id]=true;save();showHint();}},'ดูคำใบ้ (คะแนนข้อนี้เหลือ 5)'));
    q.append(hb);
  }
  card.append(el('div',{class:'tq'},el('div',{class:'tn'},(idOverride?'VM':'')+String(i+1).padStart(2,'0')),q));
  return card;
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  if(a.every((v,i)=>v===i)) return shuffle(a); return a;}
function orderWidget(id,t,solved,markSolved,wrong){
  const box=el('div');
  if(!orderState[id]) orderState[id]={pool:shuffle(t.items.map((_,i)=>i)),picked:[]};
  const st=orderState[id];
  if(solved){st.picked=t.items.map((_,i)=>i);st.pool=[];}
  const chipFace=it=>[it.sw?el('span',{class:'sw',style:`background:${it.sw}`}):null,it.t];
  function draw(){
    box.innerHTML='';
    const slots=el('div',{class:'slots'});
    t.labels.forEach((lab,si)=>{
      const idx=st.picked[si];
      const s=el('button',{class:'slot'+(idx!=null?' filled':''),'aria-label':lab+(idx!=null?' '+t.items[idx].t+' แตะเพื่อเอาออก':' ว่าง')},
        el('span',{class:'pin'},lab), idx!=null?el('span',{style:'display:inline-flex;gap:8px;align-items:center'},chipFace(t.items[idx])):el('span',{style:'color:var(--muted);font-size:14px'},'แตะตัวเลือกด้านล่างเพื่อใส่'));
      if(idx!=null && !S.done[id]) s.addEventListener('click',()=>{st.picked.splice(si,1);st.pool.push(idx);draw();});
      slots.append(s);
    });
    box.append(slots);
    if(!S.done[id]){
      box.append(el('div',{class:'pool'},st.pool.map(idx=>el('button',{class:'chip',onclick:()=>{st.pool=st.pool.filter(x=>x!==idx);st.picked.push(idx);draw();}},chipFace(t.items[idx])))));
      const full=st.picked.length===t.items.length;
      box.append(el('div',{class:'row'},
        el('button',{class:'btn',onclick:()=>{
          if(st.picked.every((v,i)=>v===i)){markSolved();draw();}
          else{const right=st.picked.filter((v,i)=>v===i).length;wrong(`ถูกตำแหน่ง ${right} จาก ${t.items.length} ช่อง แตะช่องที่ผิดเพื่อเอาออกแล้วลองใหม่`);}
        }},'ตรวจลำดับ'),
        el('button',{class:'btn ghost',onclick:()=>{st.pool=shuffle(t.items.map((_,i)=>i));st.picked=[];draw();}},'ล้าง')
      ));
      if(!full) box.lastChild.firstChild.disabled=true;
    }
  }
  draw();
  return box;
}

function terminal(quickList){
  const screen=el('div',{class:'screen',role:'log','aria-live':'polite'});
  const inp=el('input',{autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'พิมพ์คำสั่ง'});
  const hist=[];let hp=0,busy=false;
  const PROMPT='C:\\Users\\student>';
  const put=(txt,cls)=>{txt.split('\n').forEach(l=>screen.append(el('div',{class:'line'+(cls?' '+cls:'')},l||' ')));screen.scrollTop=screen.scrollHeight;};
  const slow=async lines=>{busy=true;for(const l of lines){await new Promise(r=>setTimeout(r,l.d||0));put(l.t);}busy=false;};

  const HOSTS={'192.168.20.1':[64,1],'192.168.20.10':[128,1],'192.168.20.57':[128,0],'127.0.0.1':[128,0],'localhost':[128,0],
    '8.8.8.8':[117,24],'203.0.113.80':[52,18],'www.netlab.test':[52,18]};
  const DNS={'www.netlab.test':'203.0.113.80','dns.google':'8.8.8.8','localhost':'127.0.0.1','lab-pc07':'192.168.20.57'};
  const isIP=s=>/^\d{1,3}(\.\d{1,3}){3}$/.test(s)&&s.split('.').every(n=>+n<256);

  function ping(target){
    if(!target) return put('Usage: ping <IP address หรือ ชื่อโฮสต์>');
    const t=target.toLowerCase();
    let ip=isIP(t)?t:DNS[t];
    if(!ip) return put(`Ping request could not find host ${target}. Please check the name and try again.`);
    const head=ip===t?`Pinging ${ip} with 32 bytes of data:`:`Pinging ${t} [${ip}] with 32 bytes of data:`;
    const lines=[{t:head}];let recv=4,times=[];
    if(HOSTS[ip]){
      const [ttl,base]=HOSTS[ip];
      for(let i=0;i<4;i++){const ms=base===0?0:base+Math.floor(Math.random()*3);times.push(ms);
        lines.push({t:`Reply from ${ip}: bytes=32 time${ms===0?'<1':'='+ms}ms TTL=${ttl}`,d:450});}
    }else if(ip.startsWith('192.168.20.')&&ip!=='192.168.20.99'){
      for(let i=0;i<4;i++) lines.push({t:`Reply from 192.168.20.57: Destination host unreachable.`,d:900});
    }else{
      recv=0;for(let i=0;i<4;i++) lines.push({t:'Request timed out.',d:900});
    }
    lines.push({t:'',d:100},{t:`Ping statistics for ${ip}:`},{t:`    Packets: Sent = 4, Received = ${recv}, Lost = ${4-recv} (${(4-recv)*25}% loss),`});
    if(times.length){const mn=Math.min(...times),mx=Math.max(...times),av=Math.round(times.reduce((a,b)=>a+b)/4);
      lines.push({t:'Approximate round trip times in milli-seconds:'},{t:`    Minimum = ${mn}ms, Maximum = ${mx}ms, Average = ${av}ms`});}
    return slow(lines);
  }
  function tracert(target){
    if(!target) return put('Usage: tracert <IP address หรือ ชื่อโฮสต์>');
    const t=target.toLowerCase(); const ip=isIP(t)?t:DNS[t];
    if(!ip) return put(`Unable to resolve target system name ${target}.`);
    const hops=[['192.168.20.1','gateway.lab.local'],['10.10.0.1',''],['172.20.1.1',''],['198.51.100.9','']];
    if(ip==='8.8.8.8') hops.push(['8.8.8.8','dns.google']);
    else if(ip==='203.0.113.80'){hops.push(['198.51.100.30',''],['203.0.113.80','www.netlab.test']);}
    else if(ip.startsWith('192.168.20.')){hops.length=0;hops.push([ip,'']);}
    else {hops.push(['*','']);}
    const lines=[{t:`Tracing route to ${t===ip?ip:t+' ['+ip+']'}`},{t:'over a maximum of 30 hops:'},{t:''}];
    hops.forEach(([h,n],i)=>{
      const pad=String(i+1).padStart(3);
      if(h==='*') lines.push({t:`${pad}     *        *        *     Request timed out.`,d:1200});
      else{const b=i===0?1:4+i*5;const f=x=>(x<=1?'<1 ms':x+' ms').padStart(6);
        lines.push({t:`${pad}  ${f(b)}  ${f(b+1)}  ${f(b)}  ${n?n+' ['+h+']':h}`,d:600});}
    });
    lines.push({t:''},{t:'Trace complete.'});
    return slow(lines);
  }
  const CMDS={
    help:()=>put(`คำสั่งที่ใช้ได้:
  ipconfig          ดู IP, Subnet Mask, Default Gateway
  ipconfig /all     ดูรายละเอียดทั้งหมด (MAC, DNS, DHCP)
  ping <ปลายทาง>    ทดสอบการเชื่อมต่อ
  tracert <ปลายทาง> ดูเส้นทางที่ข้อมูลเดินทาง
  nslookup <ชื่อ>    ถาม DNS ว่าชื่อนี้คือ IP อะไร
  arp -a            ดูตาราง IP ↔ MAC ในวงเครือข่าย
  hostname          ดูชื่อเครื่อง
  getmac            ดู MAC Address
  whoami            ดูบัญชีที่ล็อกอินอยู่
  net user [ชื่อ]    ดูบัญชีผู้ใช้
  net localgroup [กลุ่ม] ดูกลุ่มผู้ใช้
  net share         ดูโฟลเดอร์ที่แชร์
  net view          ดูเครื่องใน Workgroup
  cls               ล้างหน้าจอ`),
    whoami:()=>put('lab-pc07\\student'),
    net:a=>netCmd(a),
    ipconfig:a=>{
      if(a[0]&&a[0].toLowerCase()==='/all') return put(`
Windows IP Configuration

   Host Name . . . . . . . . . . . . : LAB-PC07
   Primary Dns Suffix  . . . . . . . : lab.local

Ethernet adapter Ethernet:

   Description . . . . . . . . . . . : Realtek PCIe GbE Family Controller
   Physical Address. . . . . . . . . : 00-1A-2B-3C-4D-5E
   DHCP Enabled. . . . . . . . . . . : Yes
   IPv4 Address. . . . . . . . . . . : 192.168.20.57(Preferred)
   Subnet Mask . . . . . . . . . . . : 255.255.255.0
   Lease Obtained. . . . . . . . . . : Tuesday, 8:02:14 AM
   Default Gateway . . . . . . . . . : 192.168.20.1
   DHCP Server . . . . . . . . . . . : 192.168.20.1
   DNS Servers . . . . . . . . . . . : 192.168.20.10
`);
      if(a[0]) return put(`Error: unrecognized or incomplete command line.`);
      put(`
Windows IP Configuration

Ethernet adapter Ethernet:

   Connection-specific DNS Suffix  . : lab.local
   IPv4 Address. . . . . . . . . . . : 192.168.20.57
   Subnet Mask . . . . . . . . . . . : 255.255.255.0
   Default Gateway . . . . . . . . . : 192.168.20.1
`);
    },
    ping:a=>ping(a[0]),
    tracert:a=>tracert(a[0]),
    nslookup:a=>{
      const head='Server:  dns.lab.local\nAddress:  192.168.20.10\n';
      if(!a[0]) return put(head+'\n(ในแล็บนี้ให้พิมพ์ชื่อต่อท้าย เช่น nslookup www.netlab.test)');
      const n=a[0].toLowerCase(), ip=DNS[n];
      if(!ip) return put(head+`\n*** dns.lab.local can't find ${a[0]}: Non-existent domain`);
      put(head+`\nNon-authoritative answer:\nName:    ${n}\nAddress:  ${ip}`);
    },
    arp:a=>{
      if(!a[0]||a[0].toLowerCase()!=='-a') return put('Usage: arp -a');
      put(`
Interface: 192.168.20.57 --- 0xb
  Internet Address      Physical Address      Type
  192.168.20.1          00-50-56-c0-00-01     dynamic
  192.168.20.10         00-50-56-c0-00-0a     dynamic
  192.168.20.23         3c-52-82-1f-9a-10     dynamic
  192.168.20.255        ff-ff-ff-ff-ff-ff     static
  224.0.0.22            01-00-5e-00-00-16     static
`);
    },
    hostname:()=>put('LAB-PC07'),
    getmac:()=>put(`
Physical Address    Transport Name
=================== ==========================================================
00-1A-2B-3C-4D-5E   \\Device\\Tcpip_{4F2A91C3-7B1E-4D22-9A60-11C0E5B7D3A8}`),
    cls:()=>{screen.innerHTML='';}
  };
  const OK='The command completed successfully.';
  const USERS={
    student:{full:'Student Lab',cmt:'Student account',act:'Yes',grp:'*Users'},
    teacher:{full:'Teacher NetLab',cmt:'Teacher account',act:'Yes',grp:'*Administrators       *Users'},
    administrator:{full:'',cmt:'Built-in account for administering the computer',act:'No',grp:'*Administrators'},
    guest:{full:'',cmt:'Built-in account for guest access',act:'No',grp:'*Guests'}
  };
  const GROUPS={administrators:['Administrator','teacher'],users:['student','teacher','NT AUTHORITY\\Authenticated Users'],guests:['Guest'],'remotedesktopusers':[]};
  function netCmd(a){
    const sub=(a[0]||'').toLowerCase();
    if(sub==='user'){
      if(a.includes('/add')||a.includes('/delete')) return put('System error 5 has occurred.\n\nAccess is denied.\n(บัญชี student ไม่มีสิทธิ์ Administrator จึงสร้าง/ลบบัญชีไม่ได้)');
      if(!a[1]) return put(`\nUser accounts for \\\\LAB-PC07\n\n-------------------------------------------------------------------------------\nAdministrator            DefaultAccount           Guest\nstudent                  teacher                  WDAGUtilityAccount\n${OK}`);
      const u=USERS[a[1].toLowerCase()];
      if(!u) return put('The user name could not be found.\n\nMore help is available by typing NET HELPMSG 2221.');
      const nm=a[1].toLowerCase()==='administrator'?'Administrator':a[1].toLowerCase()==='guest'?'Guest':a[1].toLowerCase();
      return put(`User name                    ${nm}\nFull Name                    ${u.full}\nComment                      ${u.cmt}\nAccount active               ${u.act}\nAccount expires              Never\n\nPassword required            ${nm==='Guest'?'No':'Yes'}\nUser may change password     Yes\n\nLocal Group Memberships      ${u.grp}\nGlobal Group memberships     *None\n${OK}`);
    }
    if(sub==='localgroup'){
      if(!a[1]) return put(`\nAliases for \\\\LAB-PC07\n\n-------------------------------------------------------------------------------\n*Administrators\n*Guests\n*Remote Desktop Users\n*Users\n${OK}`);
      const key=a.slice(1).join('').toLowerCase(), g=GROUPS[key];
      if(!g) return put('There is no such global user or group.');
      const name={administrators:'Administrators',users:'Users',guests:'Guests',remotedesktopusers:'Remote Desktop Users'}[key];
      return put(`Alias name     ${name}\n\nMembers\n\n-------------------------------------------------------------------------------\n${g.join('\n')}\n${OK}`);
    }
    if(sub==='share') return put(`\nShare name   Resource                        Remark\n\n-------------------------------------------------------------------------------\nC$           C:\\                             Default share\nIPC$                                         Remote IPC\nADMIN$       C:\\Windows                      Remote Admin\nHomework     C:\\Share\\Homework               Student homework\n${OK}`);
    if(sub==='view') return put(`Server Name            Remark\n\n-------------------------------------------------------------------------------\n\\\\LAB-PC01\n\\\\LAB-PC07\n\\\\TEACHER-PC           Teacher\n${OK}\n\n(Workgroup: NETLAB)`);
    put('The syntax of this command is:\n\nNET [ USER | LOCALGROUP | SHARE | VIEW ]');
  }
  CMDS['tracert.exe']=CMDS.tracert; CMDS['ping.exe']=CMDS.ping;

  function run(raw){
    const line=raw.trim();
    put(PROMPT+line,'prompt');
    if(!line)return;
    hist.push(line);hp=hist.length;
    const [c,...args]=line.split(/\s+/);
    const f=CMDS[c.toLowerCase()];
    if(f) f(args);
    else put(`'${c}' is not recognized as an internal or external command,\noperable program or batch file.  (พิมพ์ help เพื่อดูคำสั่ง)`);
  }
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){if(busy)return;run(inp.value);inp.value='';}
    else if(e.key==='ArrowUp'){if(hp>0){hp--;inp.value=hist[hp];}e.preventDefault();}
    else if(e.key==='ArrowDown'){if(hp<hist.length-1){hp++;inp.value=hist[hp];}else{hp=hist.length;inp.value='';}e.preventDefault();}
  });
  const quick=quickList||['help','ipconfig','cls'];
  const term=el('div',{class:'term'},
    el('div',{class:'tbar'},el('span',{},'Command Prompt — LAB-PC07'),el('span',{},'จำลอง')),
    screen,
    el('div',{class:'inrow'},el('span',{class:'prompt'},'C:\\>'),inp),
    el('div',{class:'quick'},quick.map(q=>el('button',{onclick:()=>{if(!busy){run(q);}}},q)))
  );
  screen.addEventListener('click',()=>inp.focus());
  put('Microsoft Windows [Version 10.0.19045] (จำลองเพื่อการเรียนรู้)\n\nพิมพ์ help เพื่อดูคำสั่งที่ใช้ได้\n');
  return term;
}


/* ---------- Linux VM (v86, runs in the student's browser) ---------- */
let VM=null;
function stopVM(){ if(VM){ const v=VM; VM=null; try{ v.destroy(); }catch(e){} } }
function loadScript(src){
  return new Promise((res,rej)=>{
    if(window.V86){res();return;}
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('script')); document.head.append(s);
  });
}
function vmPanel(r){
  const status=el('div',{class:'vmstatus'},'VM ยังไม่ได้เปิด กด "เปิด Linux VM" เพื่อบูตเครื่อง ครั้งแรกต้องดาวน์โหลดไฟล์ประมาณ 10 MB และบูตประมาณ 10–30 วินาที');
  const screen=el('div',{class:'vmscreen',title:'คลิกที่นี่แล้วพิมพ์คำสั่ง'},
    el('div',{style:'white-space:pre;font:14px/16px "JetBrains Mono",Consolas,monospace'}),
    el('canvas',{style:'display:none'}));
  const setStatus=(t,bad)=>{status.textContent=t;status.className='vmstatus'+(bad?' bad':'');};
  const setupBtn=el('button',{class:'btn ghost',onclick:()=>{
    if(!VM)return; VM.keyboard_send_text(r.vmSetup+'\n');
    setStatus('ส่งคำสั่งเตรียมโจทย์แล้ว ถ้าหน้าจอยังค้างอยู่ที่บรรทัดคำสั่ง ให้คลิกหน้าจอแล้วกด Enter');
  }},'เตรียมโจทย์');
  const restartBtn=el('button',{class:'btn ghost',onclick:()=>{ if(VM){ VM.restart(); setStatus('กำลังรีสตาร์ท หลังบูตเสร็จต้องกด "เตรียมโจทย์" ใหม่'); } }},'รีสตาร์ท');
  const stopBtn=el('button',{class:'btn ghost',onclick:()=>{ stopVM(); lock(true); startBtn.disabled=false; setStatus('ปิด VM แล้ว'); }},'ปิด VM');
  const lock=on=>[setupBtn,restartBtn,stopBtn].forEach(b=>b.disabled=on);
  lock(true);
  const startBtn=el('button',{class:'btn',onclick:async()=>{
    startBtn.disabled=true; setStatus('กำลังโหลดไฟล์ VM...');
    try{
      const head=await fetch(VM_BASE+'buildroot-bzimage.bin',{method:'HEAD'});
      if(!head.ok) throw new Error('noimage');
      await loadScript(VM_BASE+'libv86.js');
      stopVM();
      VM=new V86({
        wasm_path:VM_BASE+'v86.wasm',
        memory_size:128*1024*1024,
        vga_memory_size:8*1024*1024,
        screen_container:screen,
        bios:{url:VM_BASE+'seabios.bin'},
        vga_bios:{url:VM_BASE+'vgabios.bin'},
        bzimage:{url:VM_BASE+'buildroot-bzimage.bin'},
        cmdline:'tsc=reliable mitigations=off random.trust_cpu=on',
        autostart:true
      });
      VM.add_listener('emulator-ready',()=>{
        lock(false);
        setStatus('กำลังบูต รอจนเห็น prompt ของ Linux (ถ้าถามชื่อผู้ใช้ให้พิมพ์ root) แล้วกด "เตรียมโจทย์" คลิกที่หน้าจอดำก่อนพิมพ์คำสั่ง');
      });
    }catch(e){
      startBtn.disabled=false;
      let missing='';
      try{ const st=await (await fetch('vm-status')).json(); missing=st.files.filter(f=>!f.ok||!f.size).map(f=>f.name).join(', '); }catch(_){}
      setStatus('เปิด VM ไม่ได้ เพราะไม่พบไฟล์ VM บนเซิร์ฟเวอร์'+(missing?' (ไฟล์ที่ขาด: '+missing+')':'')+' ครูตรวจได้ที่หน้า /vm-status และดูวิธีแก้ใน README',true);
    }
  }},'เปิด Linux VM');
  return el('div',{class:'vm'},el('div',{class:'row',style:'margin-bottom:10px'},startBtn,setupBtn,restartBtn,stopBtn),status,screen);
}

/* ---------- summary ---------- */
function code(){
  const s=(S.name.trim()||'-')+'|'+score()+'|'+Object.keys(S.done).sort().join(',');
  let h=2166136261; for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0;}
  return h.toString(36).toUpperCase().padStart(7,'0').slice(-7);
}
function summary(){
  stopVM(); stopTick();
  app.innerHTML='';
  const max=(totalTasks+totalVM)*10;
  app.append(
    el('button',{class:'back',onclick:home},'‹ กลับหน้ารวมห้อง'),
    el('div',{class:'cert'},
      el('h1',{},'ใบสรุปผล NetLab'),
      el('p',{style:'margin:0;color:var(--muted)'},'ชื่อ: ',el('b',{style:'color:var(--ink)'},S.name.trim()||'(ยังไม่ได้กรอกชื่อ กลับไปกรอกที่หน้ารวมห้อง)')),
      el('table',{},ROOMS.map((r,ri)=>el('tr',{},el('td',{},`ห้อง ${ri+1} ${r.title}`),el('td',{},(roomDone(r)===r.tasks.length?'ผ่าน':`${roomDone(r)}/${r.tasks.length}`)+(r.vmTasks?`  VM ${vmDone(r)}/${r.vmTasks.length}`:'')+(S.timers[r.id]&&S.timers[r.id].end?`  (${fmt(S.timers[r.id].end-S.timers[r.id].start)})`:''))))),
      el('p',{style:'font-size:20px;margin:6px 0'},`คะแนนรวม ${score()} / ${max}`),
      el('p',{style:'margin:14px 0 2px;color:var(--muted);font-size:15px'},'รหัสยืนยันสำหรับส่งครู'),
      el('div',{class:'code'},code()),
      el('p',{style:'color:var(--muted);font-size:14px;margin-top:14px'},'ถ่ายภาพหน้าจอนี้ส่งครู รหัสยืนยันจะเปลี่ยนเมื่อชื่อหรือคะแนนเปลี่ยน')
    )
  );
  window.scrollTo(0,0);
}
