<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetLab ห้องปฏิบัติการเครือข่ายคอมพิวเตอร์</title>
<meta name="description" content="บทเรียน แล็บ ห้องจำลอง และแบบฝึกหัด วิชาระบบเครือข่ายคอมพิวเตอร์">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2A66CF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A21" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NetLab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F5; --panel:#FFFFFF; --ink:#1C2530; --muted:#5A6878; --line:#C6D0DA;
  --orange:#A34E0F; --green:#1B7A4B; --blue:#2A66CF; --brown:#8A5A3B; --wo:#F3F3F0;
  --ok:#1A7741; --on-accent:#FFFFFF; --bad:#C23B3B; --term-bg:#0F1A24; --term-ink:#CFE3D6; --term-dim:#7C93A6;
  --field:#F4F7FA;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A21; --panel:#1C252E; --ink:#E4EAF0; --muted:#98A7B6; --line:#33414F;
    --orange:#F08A3E; --green:#3DB474; --blue:#5B8EEA; --brown:#C08E6A; --wo:#E8E8E4;
    --ok:#45C07A; --on-accent:#0B1620; --bad:#EE6B6B; --term-bg:#0A1118; --field:#141C24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A21; --panel:#1C252E; --ink:#E4EAF0; --muted:#98A7B6; --line:#33414F;
  --orange:#F08A3E; --green:#3DB474; --blue:#5B8EEA; --brown:#C08E6A; --wo:#E8E8E4;
  --ok:#45C07A; --on-accent:#0B1620; --bad:#EE6B6B; --term-bg:#0A1118; --field:#141C24;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Anuphan","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:17px;line-height:1.65}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:24px 28px 72px}

/* hero: the 8 wires of a T568B plug */
.wires{display:flex;gap:5px;height:88px;align-items:flex-end;margin:8px 0 18px}
.wire{flex:1;border-radius:6px 6px 2px 2px;position:relative}
.wire span{position:absolute;bottom:6px;left:0;right:0;text-align:center;font:600 12px "JetBrains Mono",monospace;color:#fff;mix-blend-mode:normal}
.wire.w span{color:#333}
@media (prefers-reduced-motion:no-preference){
  .wire{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{transform:scaleY(.1);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
}
h1{font-size:34px;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0 0 22px;max-width:60ch}

.namebox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:22px}
.namebox label{font-weight:600}
.namebox input{flex:1;min-width:180px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 12px}

.progress{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}
.progress strong{font-size:22px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:26px}
.bar i{display:block;height:100%;background:var(--green);transition:width .4s}

.rooms{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.room{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;width:100%;padding:0}
.room .strip{width:14px;flex:none}
.room .body{padding:14px 16px;flex:1}
.room .num{font:600 13px "JetBrains Mono",monospace;color:var(--muted)}
.room h2{font-size:19px;margin:2px 0 4px;line-height:1.35}
.room p{margin:0;color:var(--muted);font-size:15px}
.room .stat{padding:14px 16px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;min-width:84px;font-size:14px;color:var(--muted)}
.room .stat b{font-size:20px;color:var(--ink)}
.room.done .stat b{color:var(--ok)}

.foot{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}

/* room view */
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;margin-bottom:6px}
.roomhead{display:flex;gap:16px;margin-bottom:18px}.roomhead .rs{width:10px;flex:none;border-radius:3px}
.roomhead h1{font-size:28px}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:20px}
.intro p{margin:.3em 0}
.task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.task.solved{border-color:var(--ok)}
.task .tq{display:flex;gap:12px}
.task .tn{font:600 14px "JetBrains Mono",monospace;color:var(--muted);padding-top:2px;flex:none}
.task .qtext{flex:1}
.task .qtext p{margin:0 0 10px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1;min-width:160px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:"JetBrains Mono","Anuphan",monospace;font-size:15px}
.row input:disabled{opacity:.8}
.msg{font-size:15px;margin-top:8px;min-height:1em}
.msg.ok{color:var(--ok);font-weight:600}
.msg.bad{color:var(--bad)}
.hint{background:none;border:0;color:var(--blue);padding:4px 0;font-size:15px;margin-top:4px}
.hinttext{font-size:15px;color:var(--muted);border-left:3px solid var(--blue);padding-left:10px;margin-top:6px}
.explain{font-size:15px;background:var(--field);border-radius:8px;padding:8px 12px;margin-top:10px}
pre.out{background:var(--term-bg);color:var(--term-ink);font:13.5px/1.5 "JetBrains Mono",monospace;border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 12px;white-space:pre}
.choices{display:grid;gap:8px}
.choice{display:block;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.choice.picked-bad{border-color:var(--bad);color:var(--bad)}
.choice.picked-ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel));font-weight:600}

/* ordering */
.slots{display:grid;gap:6px;margin-bottom:10px}
.slot{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:8px;padding:7px 10px;min-height:42px;background:var(--field);text-align:left;width:100%}
.slot .pin{font:600 13px "JetBrains Mono",monospace;color:var(--muted);width:48px;flex:none}
.slot.filled{border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:15px}
.sw{width:26px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}

/* terminal */
.term{background:var(--term-bg);color:var(--term-ink);border-radius:12px;font:14px/1.55 "JetBrains Mono",monospace;margin-bottom:20px;overflow:hidden}
.term .tbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:rgba(255,255,255,.06);color:var(--term-dim);font-size:13px}
.term .screen{height:340px;overflow:auto;padding:12px 14px;white-space:pre;}
.term .line{white-space:pre}
.term .prompt{color:#8FD3A8}
.term .inrow{display:flex;gap:8px;padding:0 14px 12px;align-items:center}
.term .inrow input{flex:1;background:transparent;border:0;color:var(--term-ink);font:inherit;outline:none;min-width:0}
.term .quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.term .quick button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--term-ink);border-radius:6px;padding:3px 9px;font:12.5px "JetBrains Mono",monospace}

.tag{display:inline-block;font-size:12.5px;font-weight:600;color:var(--brown);border:1px solid var(--brown);border-radius:4px;padding:0 6px;margin:0 0 6px 8px;vertical-align:middle}
.qtext>.tag{margin-left:0}
.ref{font-size:14px;color:var(--muted)}
.tag.vm{color:var(--blue);border-color:var(--blue)}
.vmhead{font-size:22px;margin:30px 0 4px}
.vmnote{color:var(--muted);margin:0 0 12px;font-size:15px}
.vm{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.vmstatus{font-size:15px;color:var(--muted);margin-bottom:10px}
.vmstatus.bad{color:var(--bad)}
.vmscreen{background:#000;color:#ddd;border-radius:8px;overflow:auto;min-height:320px;padding:6px;cursor:text}
.vmscreen canvas{max-width:100%}
.startcard{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center}
.startcard .big{font-size:24px;font-weight:700;margin:0 0 6px}
.startcard p{margin:0 0 14px;color:var(--muted)}
.btn.start{font-size:19px;padding:12px 28px;background:var(--green);color:var(--on-accent)}
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.timer .clock{font:700 26px "JetBrains Mono",monospace;flex:1}
.timer.warn{border-color:var(--orange)} .timer.warn .clock{color:var(--orange)}
.timer.urgent{border-color:var(--bad)} .timer.urgent .clock{color:var(--bad)}
.timer.done{justify-content:space-between;color:var(--muted)} .timer.done b{color:var(--ink)}
.tstat{font-size:13px;margin-top:2px}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:18px}
.tab{flex:1;border:0;background:transparent;border-radius:8px;padding:10px 8px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--bg)}
.slot.wide .pin{font:500 14px "Anuphan",sans-serif;color:var(--ink);width:auto;flex:0 0 46%}
.form{display:grid;gap:10px;margin-bottom:10px}
.frow{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:10px;align-items:center;font-size:15px}
.frow input,.frow select{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:"JetBrains Mono","Anuphan",monospace;font-size:15px;min-width:0}
.frow .bad{border-color:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 25%,transparent)}
@media (max-width:520px){.frow{grid-template-columns:1fr;gap:4px}}
.sumh{font-size:17px;margin:18px 0 0}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 18px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-brand{display:inline-flex;align-items:center;gap:8px;background:none;border:0;font-weight:700;font-size:18px;color:var(--ink);padding:4px 0}
.tb-brand svg{color:var(--blue)}
.tb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb-logo{display:inline-flex;color:var(--blue)}
.tb-menu{position:relative}
.tb-menu summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;max-width:200px}
.tb-menu summary::-webkit-details-marker{display:none}
.tb-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.tb-sub{font-size:12px;font-weight:500;color:var(--muted)}
.tb-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);display:grid;min-width:170px;overflow:hidden;z-index:30}
.tb-pop button{background:none;border:0;text-align:left;padding:10px 14px;font-size:15px}
.tb-pop button:hover{background:var(--field)}
.tb-btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.tb-btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.netbar{background:var(--orange);color:#fff;text-align:center;padding:6px 12px;font-size:14px;font-weight:600}
.timer{top:calc(env(safe-area-inset-top,0px) + 8px)}
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(10,16,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:440px;padding:18px 20px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.modal-head h2{margin:0;font-size:21px}
.modal-x{background:none;border:0;font-size:28px;line-height:1;color:var(--muted);padding:0 4px}
.mform{display:grid;gap:10px}
.mrow{display:grid;gap:4px;font-size:15px;font-weight:500}
.mrow input{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px}
.mrow small{color:var(--muted);font-weight:400}
.mnote{color:var(--muted);font-size:14px;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:60;font-weight:600}
.namebox .saved{margin-left:auto;font-size:13px;color:var(--ok);font-weight:600}
.guestnote{flex-basis:100%;margin:2px 0 0;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:600;text-decoration:underline}
.assign{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:22px}
.assign h2{font-size:17px;margin:0 0 8px}
.assign ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.asg{width:100%;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;text-align:left;background:var(--field);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:8px 12px}
.asg.done{border-left-color:var(--ok)} .asg.over{border-left-color:var(--bad)}
.asg-t{font-weight:600} .asg-d{font-size:14px;color:var(--muted)} .asg.over .asg-d{color:var(--bad);font-weight:600}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:0 0 14px;font-size:16px}
.rooms .empty{color:var(--muted);text-align:center;padding:20px}
.tag.due{color:var(--bad);border-color:var(--bad)}
.msg.wait{color:var(--muted)}
.pendingbar{background:color-mix(in srgb,var(--orange) 15%,var(--panel));border:1px solid var(--orange);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:15px}
.duehint{color:var(--bad)!important;font-weight:600}
.savednote{margin-top:14px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--ok) 12%,var(--panel));color:var(--ink)}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.flag{background:var(--panel);border:2px solid var(--ok);border-radius:12px;padding:16px 18px;margin-top:20px}
.flag code{font:600 16px "JetBrains Mono",monospace;color:var(--ok)}

/* summary */
.cert{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.cert h1{font-size:26px}
.cert table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
.cert td{padding:8px 0;border-bottom:1px solid var(--line)}
.cert td:last-child{text-align:right;font-family:"JetBrains Mono",monospace}
.code{font:600 20px "JetBrains Mono",monospace;letter-spacing:.08em}

/* ===== NetLab 2 shell ===== */
body{font-size:17px}
.ic{display:inline-flex;flex:none}
.shell{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:16px 14px 22px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:700;font-size:20px;flex-wrap:wrap}
.brand .ic{color:var(--blue)}
.brand small{flex-basis:100%;font-size:13px;font-weight:500;color:var(--muted);margin-top:-6px;padding-left:28px}
.sidesearch{display:flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--muted)}
.sidesearch input{border:0;background:transparent;padding:9px 0;flex:1;min-width:0;font-size:15px;outline:none}
.sidesearch:focus-within{outline:3px solid var(--blue);outline-offset:1px}
.side nav{display:grid;gap:2px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15.5px}
.nav .ic{color:var(--muted)}
.nav:hover{background:var(--field)}
.nav.on{background:color-mix(in srgb,var(--blue) 12%,var(--panel));color:var(--blue)} .nav.on .ic{color:var(--blue)}
.units{display:grid;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.unit summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);line-height:1.4}
.unit summary::-webkit-details-marker{display:none}
.unit summary:hover{background:var(--field)}
.udot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.lnk{display:flex;gap:8px;align-items:flex-start;padding:5px 8px 5px 24px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35}
.lnk small{display:block;color:var(--muted);font-size:12.5px}
.lnk:hover{background:var(--field)} .lnk.on{background:color-mix(in srgb,var(--blue) 10%,var(--panel))}
.led{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;background:var(--line);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 15%,transparent)}
.led.a{background:#E8B23A} .led.g{background:var(--ok)}
.theme{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14.5px;font-weight:600;color:var(--ink);margin-top:auto}
.acct{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.acct .who{display:flex;gap:8px;align-items:center} .acct .who b{display:block;font-size:15px;line-height:1.3} .acct .who small{color:var(--muted);font-size:13px}
.acctbtns{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer}
.sbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.small{font-size:14px} .muted{color:var(--muted)}
.mtop{display:none}
.scrim{display:none}
@media (max-width:759px), (max-height:500px) and (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto var(--nl-bnav) 0;height:auto;width:300px;max-width:86vw;z-index:40;transform:translateX(-105%);transition:transform .2s ease;overscroll-behavior:contain}
