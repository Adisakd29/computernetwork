# Runs every NetLab test on GitHub for each push / pull request:
# content checks, simulator logic, API (PostgreSQL), and browser tests on Chromium + a smoke test on Firefox and WebKit (Safari engine).
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/netlab_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/netlab_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Content and simulator checks
        run: |
          npm test
          node tests/bank-check.js
          node tests/lessons-check.js
          node tests/forms-check.js
          for f in tests/sims/*.test.js; do node "$f"; done
      - name: Create test databases
        run: psql -h localhost -U postgres -c 'CREATE DATABASE netlab_test' -c 'CREATE DATABASE netlab_e2e'
      - name: API tests (PostgreSQL)
        run: npm run test:api
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright browsers
        run: |
          pip install playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium firefox webkit
      - name: Browser tests (Chromium full suite, smoke on Firefox and WebKit)
        env:
          SMOKE_BROWSERS: chromium firefox webkit
          OUT: ${{ runner.temp }}/e2e
        run: sh tests/e2e/run.sh
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e/*.png
          if-no-files-found: ignore
